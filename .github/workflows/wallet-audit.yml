name: Wallet LP Audit

on:
  push:
    branches: [main]
    paths:
      - ".audit-trigger"
      - "src/tools/audit-wallet-v2.js"
      - ".github/workflows/wallet-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional wallet secret
        id: wallet
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        run: |
          if [[ -n "$WALLET_ADDRESS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Wallet audit skipped: WALLET_ADDRESS secret is not configured."
          fi
      - name: Scan wallet on Robinhood Chain
        if: steps.wallet.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_SYMBOLS: "CASHCAT,USDG"
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          ENABLE_AUTO_REDEPLOY: "false"
          LOG_FROM_BLOCK: "44000000"
          LOG_CHUNK_BLOCKS: "500000"
          MIN_LOG_CHUNK_BLOCKS: "25000"
          SWAP_SLIPPAGE_BPS: "50"
          DATA_DIR: "./data"
          STATE_FILE: "./state/audit-state.json"
        run: |
          if node src/tools/audit-wallet-v2.js > "$RUNNER_TEMP/wallet-audit.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          rm -f "$RUNNER_TEMP/wallet-audit.log"
          rm -rf data/audits
          if [ "$status" -ne 0 ]; then
            echo "::error::Wallet audit failed; wallet-specific report details were withheld."
            exit "$status"
          fi
          echo "Wallet audit completed; the report was kept off public logs and artifacts."
