name: Wallet LP Audit

on:
  push:
    branches: [main]
    paths:
      - ".audit-trigger"
      - "src/tools/audit-wallet.js"
      - ".github/workflows/wallet-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Scan wallet on Robinhood Chain
        env:
          RPC_URLS: https://rpc.mainnet.chain.robinhood.com
          WALLET_ADDRESS: 0x6F196aF3B69c521eEd9436Abc9130699dF1c50bF
          TARGET_SYMBOLS: CASHCAT,USDG
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          ENABLE_AUTO_REDEPLOY: "false"
          LOG_FROM_BLOCK: "44000000"
          LOG_CHUNK_BLOCKS: "500000"
          MIN_LOG_CHUNK_BLOCKS: "25000"
          SWAP_SLIPPAGE_BPS: "50"
          DATA_DIR: ./data
          STATE_FILE: ./state/audit-state.json
        run: npm run audit:wallet
      - name: Show report
        if: always()
        run: |
          if [ -f data/audits/latest.md ]; then
            cat data/audits/latest.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-lp-audit
          path: data/audits/
          if-no-files-found: warn
