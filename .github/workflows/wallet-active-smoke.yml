name: Wallet Active Smoke

on:
  push:
    branches: [main]
    paths:
      - ".smoke-trigger"
      - "src/bot.js"
      - "src/adapters/fables.js"
      - "src/config.js"
      - ".github/workflows/wallet-active-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional wallet and discovery configuration
        id: wallet
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          DISCOVERY_FROM_BLOCK: ${{ vars.WALLET_POOL_DISCOVERY_FROM_BLOCK }}
        run: |
          if [[ -n "$WALLET_ADDRESS" && "$DISCOVERY_FROM_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Wallet active smoke skipped: required repository settings are not configured."
          fi
      - name: Initialize empty wallet topology state
        if: steps.wallet.outputs.configured == 'true'
        run: |
          mkdir -p state data
          printf '%s\n' '{"positions":{},"rebalanceHistory":[],"cursors":{},"settings":{}}' > state/smoke-state.json
      - name: Run production bot once in wallet-active dry-run mode
        if: steps.wallet.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_MODE: "wallet-active"
          TARGET_SYMBOLS: ""
          TARGET_POOL_IDS: ""
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          ENABLE_AUTO_REDEPLOY: "false"
          LOG_FROM_BLOCK: "44000000"
          WALLET_POOL_DISCOVERY_FROM_BLOCK: ${{ vars.WALLET_POOL_DISCOVERY_FROM_BLOCK }}
          REORG_LOOKBACK_BLOCKS: "64"
          MANUAL_TOPOLOGY_COOLDOWN_SEC: "120"
          FEE_LOG_FROM_BLOCK: "999999999"
          POINTS_GLOBAL_SWAP_SCAN_ENABLED: "false"
          DATA_DIR: "./data"
          STATE_FILE: "./state/smoke-state.json"
        run: |
          if npm run once > "$RUNNER_TEMP/wallet-active-bot.log" 2>&1; then
            rm -f "$RUNNER_TEMP/wallet-active-bot.log"
            echo "Wallet-active dry-run completed."
          else
            status=$?
            rm -f "$RUNNER_TEMP/wallet-active-bot.log"
            echo "::error::Wallet-active dry-run failed; wallet-specific diagnostics were withheld."
            exit "$status"
          fi
      - name: Independently verify current wallet-active topology
        if: steps.wallet.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_MODE: "wallet-active"
          WALLET_POOL_DISCOVERY_FROM_BLOCK: ${{ vars.WALLET_POOL_DISCOVERY_FROM_BLOCK }}
          VERIFY_FROM_BLOCK: ${{ vars.WALLET_POOL_DISCOVERY_FROM_BLOCK }}
          STATE_FILE: "./state/smoke-state.json"
        run: |
          if node src/tools/verify-wallet-topology.js > "$RUNNER_TEMP/wallet-topology-verify.log" 2>&1; then
            rm -f "$RUNNER_TEMP/wallet-topology-verify.log"
            echo "Wallet topology verification completed."
          else
            status=$?
            rm -f "$RUNNER_TEMP/wallet-topology-verify.log"
            echo "::error::Wallet topology verification failed; wallet-specific diagnostics were withheld."
            exit "$status"
          fi
      - name: Remove wallet-specific smoke data
        if: always()
        run: |
          rm -f state/smoke-state.json
          rm -rf data