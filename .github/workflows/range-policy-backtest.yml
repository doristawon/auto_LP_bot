name: Range Policy Backtest

on:
  push:
    branches: [main]
    paths:
      - ".range-policy-trigger"
      - "src/tools/analyze-range-policy.js"
      - ".github/workflows/range-policy-backtest.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional wallet and range start
        id: wallet
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          RANGE_BACKTEST_FROM_BLOCK: ${{ vars.RANGE_BACKTEST_FROM_BLOCK }}
        run: |
          if [[ -n "$WALLET_ADDRESS" && "$RANGE_BACKTEST_FROM_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Wallet range backtest skipped: wallet secret or range start setting is missing."
          fi
      - name: Backtest wallet LP range exit policy
        if: steps.wallet.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_MODE: "wallet-active"
          LOG_FROM_BLOCK: "44000000"
          RANGE_BACKTEST_FROM_BLOCK: ${{ vars.RANGE_BACKTEST_FROM_BLOCK }}
          RANGE_SCAN_MINUTES: "5,10,15,30"
          RANGE_WAIT_MINUTES: "30,60,90,120,180"
          RANGE_OOR_THRESHOLDS_PCT: "0.25,0.5,0.75,1"
          RANGE_DEEP_CONFIRM_SCANS: "1,2"
          RANGE_POST_CLOSE_LOOKAHEAD_MIN: "180"
          DATA_DIR: "./data"
          STATE_FILE: "./state/range-policy-state.json"
        run: |
          if node src/tools/analyze-range-policy.js > "$RUNNER_TEMP/range-policy-backtest.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          rm -f "$RUNNER_TEMP/range-policy-backtest.log"
          rm -f data/range-policy-backtest.json data/range-policy-backtest.md state/range-policy-state.json
          if [ "$status" -ne 0 ]; then
            echo "::error::Wallet range backtest failed; wallet-specific results were withheld."
            exit "$status"
          fi
          echo "Wallet range backtest completed; wallet-specific results were not published."
