name: V4 Swap Simulation

on:
  push:
    branches: [main]
    paths:
      - ".v4-sim-trigger"
      - "src/adapters/universal-router.js"
      - "src/tools/simulate-v4-swap.js"
      - ".github/workflows/v4-swap-sim.yml"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: "USDG/MOO"
            token_in: "USDG"
          - pair: "USDG/MOO"
            token_in: "MOO"
          - pair: "USDG/ZZZ"
            token_in: "USDG"
          - pair: "USDG/ZZZ"
            token_in: "ZZZ"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional wallet secret
        id: wallet
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        run: |
          if [[ -n "$WALLET_ADDRESS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "V4 simulation skipped: WALLET_ADDRESS secret is not configured."
          fi
      - name: Simulate minimal V4 exact-in route
        if: steps.wallet.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_MODE: "wallet-active"
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          SIM_PAIR: "${{ matrix.pair }}"
          SIM_TOKEN_IN: "${{ matrix.token_in }}"
          SIM_AMOUNT_IN: "1"
          SWAP_SLIPPAGE_BPS: "50"
        run: |
          if node src/tools/simulate-v4-swap.js > "$RUNNER_TEMP/v4-swap-sim.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          rm -f "$RUNNER_TEMP/v4-swap-sim.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::V4 simulation failed; wallet-specific diagnostics were withheld."
            exit "$status"
          fi
          echo "V4 simulation completed; wallet-specific output was withheld."
