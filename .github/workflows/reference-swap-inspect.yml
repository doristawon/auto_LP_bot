name: Reference Swap Inspect

on:
  push:
    branches: [main]
    paths:
      - ".swap-inspect-trigger"
      - ".github/workflows/reference-swap-inspect.yml"
      - "src/tools/decode-universal-router-tx.js"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional reference swap secrets
        id: reference
        env:
          REFERENCE_TX_HASHES: ${{ secrets.REFERENCE_SWAP_TX_HASHES }}
        run: |
          if [[ -n "$REFERENCE_TX_HASHES" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Reference swap inspection skipped: transaction hashes are not configured."
          fi
      - name: Decode optional Universal Router transactions
        if: steps.reference.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          REFERENCE_TX_HASHES: ${{ secrets.REFERENCE_SWAP_TX_HASHES }}
        run: |
          set -euo pipefail
          while IFS= read -r tx; do
            [[ -z "$tx" ]] && continue
            if [[ ! "$tx" =~ ^0x[[:xdigit:]]{64}$ ]]; then
              echo "::error::Reference transaction secret contains an invalid hash format."
              exit 2
            fi
            if node src/tools/decode-universal-router-tx.js "$tx" > "$RUNNER_TEMP/reference-swap.log" 2>&1; then
              rm -f "$RUNNER_TEMP/reference-swap.log"
            else
              status=$?
              rm -f "$RUNNER_TEMP/reference-swap.log"
              echo "::error::Reference swap decoder failed; transaction details were withheld."
              exit "$status"
            fi
          done <<< "${REFERENCE_TX_HASHES//,/$'\n'}"
          echo "Reference swap decoding completed."
      - name: Remove reference inspection output
        if: always()
        run: rm -rf data/reference-tx