name: EIP7702 Probe

on:
  push:
    branches: [main]
    paths:
      - ".eip7702-probe-trigger"
      - "src/tools/probe-7702.js"
      - ".github/workflows/eip7702-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Scan Robinhood Chain for EIP-7702 type-4 transactions
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: "0x6F196aF3B69c521eEd9436Abc9130699dF1c50bF"
          EIP7702_PROBE_BLOCKS: "1000"
        run: npm run probe:7702
