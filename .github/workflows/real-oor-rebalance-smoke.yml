name: Real OOR Policy Smoke

on:
  push:
    branches: [main]
    paths:
      - ".oor-smoke-trigger"
      - "src/strategy.js"
      - "src/bot.js"
      - "src/adapters/executor.js"
      - ".github/workflows/real-oor-rebalance-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional wallet secret
        id: wallet
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        run: |
          if [[ -n "$WALLET_ADDRESS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OOR policy smoke skipped: WALLET_ADDRESS secret is not configured."
          fi
      - name: First observation against current real wallet topology
        if: steps.wallet.outputs.configured == 'true'
        env: &env
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_MODE: "wallet-active"
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          ENABLE_AUTO_REDEPLOY: "false"
          LOG_FROM_BLOCK: "44000000"
          WALLET_POOL_DISCOVERY_FROM_BLOCK: ${{ vars.WALLET_POOL_DISCOVERY_FROM_BLOCK || '44000000' }}
          REORG_LOOKBACK_BLOCKS: "64"
          RANGE_CHECK_INTERVAL_MS: "300000"
          OOR_SHALLOW_THRESHOLD_PCT: "0.5"
          OOR_MAX_WAIT_MIN: "30"
          OOR_DEEP_CONFIRMATIONS: "2"
          MANUAL_TOPOLOGY_COOLDOWN_SEC: "0"
          FEE_LOG_FROM_BLOCK: "999999999"
          POINTS_GLOBAL_SWAP_SCAN_ENABLED: "false"
          SWAP_SLIPPAGE_BPS: "50"
          DEPOSIT_SLIPPAGE_BPS: "50"
          DATA_DIR: "./data"
          STATE_FILE: "./state/oor-smoke-state.json"
        run: |
          if npm run once > "$RUNNER_TEMP/real-oor-first.log" 2>&1; then
            rm -f "$RUNNER_TEMP/real-oor-first.log"
            echo "First policy observation completed."
          else
            status=$?
            rm -f "$RUNNER_TEMP/real-oor-first.log"
            echo "::error::First policy observation failed; wallet-specific diagnostics were withheld."
            exit "$status"
          fi
      - name: Advance policy clock by one 5-minute sample without changing chain state
        if: steps.wallet.outputs.configured == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'state/oor-smoke-state.json';
          const state = JSON.parse(fs.readFileSync(file, 'utf8'));
          const M5 = 5 * 60 * 1000;
          for (const position of Object.values(state.positions || {})) {
            if (position.lastRangeEvaluationAt) position.lastRangeEvaluationAt -= M5;
            if (position.outOfRangeSince) position.outOfRangeSince -= M5;
          }
          fs.writeFileSync(file, JSON.stringify(state, null, 2));
          NODE
      - name: Second policy observation against latest real tick
        if: steps.wallet.outputs.configured == 'true'
        env: *env
        run: |
          if npm run once > "$RUNNER_TEMP/real-oor-second.log" 2>&1; then
            rm -f "$RUNNER_TEMP/real-oor-second.log"
            echo "Second policy observation completed."
          else
            status=$?
            rm -f "$RUNNER_TEMP/real-oor-second.log"
            echo "::error::Second policy observation failed; wallet-specific diagnostics were withheld."
            exit "$status"
          fi
      - name: Assert 5-minute policy sample, absolute in-range hold, and dry-run isolation
        if: steps.wallet.outputs.configured == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync('state/oor-smoke-state.json', 'utf8'));
          const snapshot = JSON.parse(fs.readFileSync('data/latest-snapshot.json', 'utf8'));
          const text = fs.existsSync('data/events.jsonl') ? fs.readFileSync('data/events.jsonl', 'utf8').trim() : '';
          const events = text ? text.split(/\r?\n/).filter(Boolean).map(JSON.parse) : [];
          const positions = snapshot.portfolio?.positions || [];
          const dryRuns = events.filter((e) => e.type === 'rebalance.dry_run');

          for (const p of positions) {
            const dry = dryRuns.some((e) => e.poolId === p.poolId && e.position?.id === p.id);
            if (!p.outside) {
              if (p.shouldRebalance) throw new Error('In-range hold assertion failed');
              if (p.rebalancePlan) throw new Error('In-range plan assertion failed');
              if (dry) throw new Error('In-range dry-run assertion failed');
            }
            if (p.outside && Number(p.excursionPct) > 0.5 && Number(p.deepConfirmations) >= 2) {
              if (!p.shouldRebalance) throw new Error('Deep OOR confirmation assertion failed');
              if (!dry) throw new Error('Eligible OOR dry-run assertion failed');
            }
            if (p.outside && Number(p.excursionPct) <= 0.5 && Number(p.outOfRangeElapsedMin) < 30) {
              if (p.shouldRebalance || dry) throw new Error('Shallow OOR wait assertion failed');
            }
          }

          // Dry-run must not be committed as a real rebalance.
          if ((state.rebalanceHistory || []).length !== 0) {
            throw new Error('dry-run polluted rebalanceHistory');
          }
          console.log('OOR policy assertions passed.');
          NODE
      - name: Remove wallet-specific smoke data
        if: always()
        run: |
          rm -f state/oor-smoke-state.json
          rm -rf data
