name: Real OOR Policy Smoke

on:
  push:
    branches: [main]
    paths:
      - ".oor-smoke-trigger"
      - "src/strategy.js"
      - "src/bot.js"
      - "src/adapters/executor.js"
      - ".github/workflows/real-oor-rebalance-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: First observation against current real wallet topology
        env: &env
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: "0x6F196aF3B69c521eEd9436Abc9130699dF1c50bF"
          TARGET_MODE: "wallet-active"
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          ENABLE_AUTO_REDEPLOY: "false"
          LOG_FROM_BLOCK: "44000000"
          WALLET_POOL_DISCOVERY_FROM_BLOCK: "71121689"
          REORG_LOOKBACK_BLOCKS: "64"
          RANGE_CHECK_INTERVAL_MS: "900000"
          OOR_SHALLOW_THRESHOLD_PCT: "0.5"
          OOR_MAX_WAIT_MIN: "90"
          OOR_DEEP_CONFIRMATIONS: "2"
          MANUAL_TOPOLOGY_COOLDOWN_SEC: "0"
          FEE_LOG_FROM_BLOCK: "999999999"
          POINTS_GLOBAL_SWAP_SCAN_ENABLED: "false"
          SWAP_SLIPPAGE_BPS: "50"
          DEPOSIT_SLIPPAGE_BPS: "50"
          DATA_DIR: "./data"
          STATE_FILE: "./state/oor-smoke-state.json"
        run: npm run once
      - name: Advance policy clock by one 15-minute sample without changing chain state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'state/oor-smoke-state.json';
          const state = JSON.parse(fs.readFileSync(file, 'utf8'));
          const M15 = 15 * 60 * 1000;
          for (const position of Object.values(state.positions || {})) {
            if (position.lastRangeEvaluationAt) position.lastRangeEvaluationAt -= M15;
            if (position.outOfRangeSince) position.outOfRangeSince -= M15;
          }
          fs.writeFileSync(file, JSON.stringify(state, null, 2));
          NODE
      - name: Second policy observation against latest real tick
        env: *env
        run: npm run once
      - name: Assert 15-minute hysteresis, absolute in-range hold, and dry-run isolation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync('state/oor-smoke-state.json', 'utf8'));
          const snapshot = JSON.parse(fs.readFileSync('data/latest-snapshot.json', 'utf8'));
          const text = fs.existsSync('data/events.jsonl') ? fs.readFileSync('data/events.jsonl', 'utf8').trim() : '';
          const events = text ? text.split(/\r?\n/).filter(Boolean).map(JSON.parse) : [];
          const positions = snapshot.portfolio?.positions || [];
          const dryRuns = events.filter((e) => e.type === 'rebalance.dry_run');

          const summary = positions.map((p) => ({
            pair: p.pair,
            currentTick: p.currentTick,
            range: [p.tickLower, p.tickUpper],
            outside: p.outside,
            excursionPct: p.excursionPct,
            deepConfirmations: p.deepConfirmations,
            elapsedMin: p.outOfRangeElapsedMin,
            shouldRebalance: p.shouldRebalance,
            hasPlan: Boolean(p.rebalancePlan),
            dryRun: dryRuns.some((e) => e.poolId === p.poolId && e.position?.id === p.id)
          }));
          console.log(JSON.stringify({ summary, dryRunCount: dryRuns.length }, null, 2));

          for (const p of positions) {
            const dry = dryRuns.some((e) => e.poolId === p.poolId && e.position?.id === p.id);
            if (!p.outside) {
              if (p.shouldRebalance) throw new Error('IN-RANGE position became rebalance-eligible: ' + p.pair);
              if (p.rebalancePlan) throw new Error('IN-RANGE position has an auto rebalance plan: ' + p.pair);
              if (dry) throw new Error('IN-RANGE position produced a dry-run: ' + p.pair);
            }
            if (p.outside && Number(p.excursionPct) > 0.5 && Number(p.deepConfirmations) >= 2) {
              if (!p.shouldRebalance) throw new Error('Deep OOR position was not eligible after simulated second 15m sample: ' + p.pair);
              if (!dry) throw new Error('Eligible OOR position did not produce dry-run: ' + p.pair);
            }
            if (p.outside && Number(p.excursionPct) <= 0.5 && Number(p.outOfRangeElapsedMin) < 90) {
              if (p.shouldRebalance || dry) throw new Error('Shallow OOR position moved before 90m: ' + p.pair);
            }
          }

          // Dry-run must not be committed as a real rebalance.
          if ((state.rebalanceHistory || []).length !== 0) {
            throw new Error('dry-run polluted rebalanceHistory');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-oor-policy-smoke
          path: |
            state/oor-smoke-state.json
            data/latest-snapshot.json
            data/events.jsonl
          if-no-files-found: warn
