name: Build Public Release

on:
  push:
    branches: [main, public-release-prep]
    paths:
      - "scripts/build-public-release.js"
      - ".github/workflows/public-release.yml"
      - "src/**"
      - "test/**"
      - "docs/**"
      - "contracts/**"
      - "scripts/**"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production source
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npm run compile:guard
          npm test

      - name: Build sanitized public snapshot
        run: node scripts/build-public-release.js --out=artifacts/public-release

      - name: Validate sanitized public snapshot
        working-directory: artifacts/public-release
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npm run compile:guard
          npm test

      - name: Remove validation-only generated files
        run: |
          rm -rf artifacts/public-release/node_modules
          rm -rf artifacts/public-release/artifacts

      - name: Final privacy scan summary
        run: |
          test -f artifacts/public-release/PUBLIC_RELEASE_MANIFEST.md
          test ! -e public-release

      - name: Upload public-ready source
        uses: actions/upload-artifact@v4
        with:
          name: auto-lp-bot-public-ready
          path: artifacts/public-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
