name: Build Public Release

on:
  push:
    branches: [public-release-prep]
    paths:
      - "scripts/build-public-release.js"
      - ".github/workflows/public-release.yml"
      - "src/**"
      - "test/**"
      - "docs/**"
      - "contracts/**"
      - "scripts/**"
      - ".env.example"
      - ".gitignore"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  build-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production source
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npm run compile:guard
          npm test

      - name: Build sanitized public snapshot
        run: node scripts/build-public-release.js

      - name: Validate sanitized public snapshot
        working-directory: public-release
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
          npm run compile:guard
          npm test

      - name: Final privacy scan summary
        run: |
          test -f public-release/PUBLIC_RELEASE_MANIFEST.md
          ! grep -Rni --exclude='package-lock.json' \
            -e 'doristawon@gmail.com' \
            -e '6F196aF3B69c521eEd9436Abc9130699dF1c50bF' \
            -e '2Ea3d6F7b1841687324819c239E6f657435FDe6e' \
            -e '4473378d0f20e03c647fe0d5b22a482b5700af7638578046d41396b5adf2dd30' \
            public-release

      - name: Upload public-ready source
        uses: actions/upload-artifact@v4
        with:
          name: auto-lp-bot-public-ready
          path: public-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
