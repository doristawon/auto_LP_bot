name: Real Wallet Replay

on:
  push:
    branches: [main]
    paths:
      - ".real-replay-trigger"
      - "src/tools/replay-wallet-rebalances.js"
      - ".github/workflows/real-wallet-replay.yml"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional wallet secret
        id: wallet
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        run: |
          if [[ -n "$WALLET_ADDRESS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Wallet replay skipped: WALLET_ADDRESS secret is not configured."
          fi
      - name: Replay real wallet lifecycle and rebalance paths
        if: steps.wallet.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          TARGET_MODE: "wallet-active"
          LOG_FROM_BLOCK: "44000000"
          REPLAY_FROM_BLOCK: "69000000"
          REPLAY_DEPOSIT_LOOKAHEAD_MIN: "180"
          DATA_DIR: "./data"
          STATE_FILE: "./state/replay-state.json"
        run: |
          if node src/tools/replay-wallet-rebalances.js > "$RUNNER_TEMP/real-wallet-replay.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          rm -f "$RUNNER_TEMP/real-wallet-replay.log"
          rm -rf data/real-replay
          if [ "$status" -ne 0 ]; then
            echo "::error::Wallet replay failed; wallet-specific diagnostics were withheld."
            exit "$status"
          fi
          echo "Wallet replay completed; wallet-specific results were not published."
