name: Reference Withdraw Inspect

on:
  push:
    branches: [main]
    paths:
      - ".withdraw-inspect-trigger"
      - ".github/workflows/reference-withdraw-inspect.yml"
      - "src/tools/inspect-reference-tx.js"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check optional reference transaction secrets
        id: reference
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          REFERENCE_TX_HASHES: ${{ secrets.REFERENCE_WITHDRAW_TX_HASHES }}
        run: |
          if [[ -n "$WALLET_ADDRESS" && -n "$REFERENCE_TX_HASHES" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Reference withdraw inspection skipped: required secrets are not configured."
          fi
      - name: Inspect optional reference withdrawals
        if: steps.reference.outputs.configured == 'true'
        env:
          RPC_URLS: "https://rpc.mainnet.chain.robinhood.com"
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          REFERENCE_TX_HASHES: ${{ secrets.REFERENCE_WITHDRAW_TX_HASHES }}
          DRY_RUN: "true"
          ENABLE_LIVE_WRITES: "false"
          DATA_DIR: "./data"
        run: |
          set -euo pipefail
          while IFS= read -r tx; do
            [[ -z "$tx" ]] && continue
            if [[ ! "$tx" =~ ^0x[[:xdigit:]]{64}$ ]]; then
              echo "::error::Reference transaction secret contains an invalid hash format."
              exit 2
            fi
            if node src/tools/inspect-reference-tx.js "$tx" > "$RUNNER_TEMP/reference-withdraw.log" 2>&1; then
              :
            else
              status=$?
              rm -f "$RUNNER_TEMP/reference-withdraw.log"
              echo "::error::Reference withdraw inspection failed; transaction details were withheld."
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/reference-withdraw.log"
          done <<< "${REFERENCE_TX_HASHES//,/$'\n'}"
          echo "Reference withdraw inspection completed."
      - name: Remove reference inspection output
        if: always()
        run: rm -rf data/reference-tx